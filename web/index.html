<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字档案长期保存</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}input,textarea,button,select{font:inherit;padding:8px;margin:4px}textarea{width:100%;height:110px}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin:12px 0}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}</style></head>
<body><h1>数字档案长期保存</h1><p>演示账号：owner、archivist、auditor、outsider。请求使用 <code>X-User-Id</code>。</p>
<section class="panel"><select id="user"><option>owner</option><option>archivist</option><option>auditor</option><option>outsider</option></select>
<button onclick="loadStatus()">查看档案状态</button><pre id="out"></pre></section>
<section class="panel"><h2>保管机构与轮值</h2>
<button onclick="loadInstitutions()">查看机构</button>
<button onclick="loadProtection()">查看版本保护状态</button>
<pre id="inst"></pre></section>
<p>轮值交接流程：登记 → 新机构核对摘要/大小 → 在任机构确认 → 完成（旧副本留住，审计记录谁接手、谁退出）。详见 README。</p>
<script>const out=document.querySelector("#out"),inst=document.querySelector("#inst"),user=document.querySelector("#user");async function loadStatus(){const id=prompt("档案 ID","1");const r=await fetch(`/api/archives/${id}/status`,{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}async function loadInstitutions(){const r=await fetch("/api/institutions",{headers:{"X-User-Id":user.value}});inst.textContent=JSON.stringify(await r.json(),null,2)}async function loadProtection(){const id=prompt("版本 ID","1");const r=await fetch(`/api/versions/${id}/protection`,{headers:{"X-User-Id":user.value}});inst.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
